<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VLSM Master: Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800;900&display=swap');
        body { font-family: 'Outfit', sans-serif; background: #0f0f1a; color: #fff; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .text-gradient { background: linear-gradient(90deg, #ff6b35, #ffd700); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-gradient { background: linear-gradient(135deg, #ff6b35, #ffd700); color: #000; transition: transform 0.2s, box-shadow 0.2s; }
        .btn-gradient:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 107, 53, 0.4); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="glass-panel p-8 max-w-md w-full text-center">
        <h1 class="text-4xl font-black text-gradient mb-2"><i class="fa-solid fa-network-wired"></i> VLSM Master</h1>
        <p class="text-gray-400 mb-8">Identifique-se para entrar na War Room e salvar seu progresso localmente.</p>
        
        <form id="login-form" class="space-y-4 text-left">
            <div>
                <label class="block text-sm font-bold text-gray-300 mb-1">Seu Nome / Matrícula</label>
                <input type="text" id="user-name" required class="w-full bg-black/50 border border-gray-600 rounded-lg p-3 text-white focus:border-yellow-400 focus:outline-none" placeholder="Ex: João Silva">
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-300 mb-1">Seu E-mail Institucional</label>
                <input type="email" id="user-email" required class="w-full bg-black/50 border border-gray-600 rounded-lg p-3 text-white focus:border-yellow-400 focus:outline-none" placeholder="joao@fans.edu.br">
            </div>
            <button type="submit" class="w-full btn-gradient py-3 rounded-lg mt-4 text-lg font-bold"><i class="fa-solid fa-right-to-bracket mr-2"></i> Iniciar Missão</button>
        </form>
    </div>
    <script>
        window.onload = () => {
            if(localStorage.getItem('vlsm_user')) window.location.href = 'dashboard.html';
        };
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const user = {
                name: document.getElementById('user-name').value,
                email: document.getElementById('user-email').value
            };
            localStorage.setItem('vlsm_user', JSON.stringify(user));
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
